<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".4"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.orbit-particle{animation:spin 20s linear infinite;transform-origin:600px 150px}.pulse-glow{animation:pulse 4s ease-in-out infinite alternate}</style><rect width="1200" height="300" fill="url(#bg)" rx="16"/><circle cx="600" cy="150" r="250" fill="url(#glow)" class="pulse-glow"/><g fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"><circle cx="600" cy="150" r="120" stroke-dasharray="6 6"/><circle cx="600" cy="150" r="200" stroke-dasharray="4 8"/><line x1="100" x2="1100" y1="150" y2="150"/></g><g class="orbit-particle"><circle cx="720" cy="150" r="5" fill="#38bdf8"/><circle cx="400" cy="150" r="4" fill="#c084fc"/><circle cx="600" cy="50" r="6" fill="#818cf8"/></g><g text-anchor="middle"><rect width="300" height="32" x="450" y="45" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" rx="16"/><text x="600" y="66" class="badge-text">🧠 KNOWLEDGE MANAGEMENT ECOSYSTEM 📚</text><text x="600" y="140" class="title">Awesome Knowledge